      A(mainEl, [0, 1, -1, .8, -.6, .4, -.2, 0].map(function (k, i) { return { transform: 'translate(' + (k * amp) + 'px,' + (i % 2 ? -k * amp * .6 : k * amp * .6) + 'px)' }; }),
        { delay: ms(at), duration: dur, easing: 'linear', fill: 'none' });
    };
    shake(T.impact, 7, 340);
    shake(T.lock, 3, 200);
    A(document.querySelector('.lead'), [{ transform: 'translateY(64px)', opacity: 0 }, { transform: 'translateY(0px)', opacity: 1 }], { delay: ms(T.rise), duration: T.riseDur * 1000, easing: 'cubic-bezier(.16,1,.3,1)' });
    A($('rl-row'), [{ transform: 'translateY(64px)', opacity: 0 }, { transform: 'translateY(0px)', opacity: 1 }], { delay: ms(T.rise + 0.14), duration: T.riseDur * 1000, easing: 'cubic-bezier(.16,1,.3,1)' });
    // last of all, the header slides down from above the screen and the footer up from below it
    var hd = document.querySelector('header'), ft = document.querySelector('.foot'), hr = hd.getBoundingClientRect(), fr = ft.getBoundingClientRect();
    A(hd, [{ transform: 'translateY(' + (-(hr.bottom + 8)) + 'px)', opacity: 1 }, { transform: 'translateY(0px)', opacity: 1 }], { delay: ms(T.chrome), duration: T.chromeDur * 1000, easing: 'cubic-bezier(.16,1,.3,1)' });
    A(ft, [{ transform: 'translateY(' + (vh - fr.top + 8) + 'px)', opacity: 1 }, { transform: 'translateY(0px)', opacity: 1 }], { delay: ms(T.chrome), duration: T.chromeDur * 1000, easing: 'cubic-bezier(.16,1,.3,1)' });
    setTimeout(function () { gate.hidden = true; }, ms(0.3));
    setTimeout(function () { if (soundOn && ctx) startMusic(); if (wave && wave.beginElement) { try { wave.beginElement(); } catch (e) {} } }, ms(T.pan));
    setTimeout(function () {
      root.className = root.className.replace(' intro', '');
      anims.forEach(function (a) { try { a.cancel(); } catch (e) {} });
    }, ms(T.chrome + T.chromeDur + 0.1));
  }
  if (!reduce) {
    var gate = $('rl-gate');
    if (!soundOn || !AC || !document.body.animate) {
      gate.hidden = true;
      if (document.body.animate) requestAnimationFrame(function () { run(true); }); else root.className = root.className.replace(' intro', '');
    } else {
      initAudio();                               // start loading now; nothing plays before the tap
      var started = false;
      var go = function () {
        if (started) return; started = true;
        var wait = 0, tick = function () {      // give the two effects up to 1.2 s to finish decoding
          if ((buffers.impact && buffers.door) || wait > 1200) run(false); else { wait += 60; setTimeout(tick, 60); }
        };
        unlock().then(tick);
      };
      gate.addEventListener('click', go);
      // the Enter or Space key also enters (without focusing the button on load, which drew a second ring around it)
      document.addEventListener('keydown', function (e) { if (!started && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go(); } });
    }
  } else {
    $('rl-gate').hidden = true;
  }

  // ---- sign-up ----
  var form = $('rl-form'), done = $('rl-done'), err = $('rl-error'), go2 = form.querySelector('.go'), hp = $('rl-hp');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (hp.value) { form.hidden = true; done.hidden = false; return; }   // a bot filled the hidden field
    go2.disabled = true;
    err.hidden = true;
    err.textContent = '';
    fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        form.hidden = true;
        done.hidden = false;
        done.focus();
      })
      .catch(function () {
        err.textContent = 'Something went wrong. Try again.';
        err.hidden = false;
        go2.disabled = false;
      });
  });
})();
</script>
